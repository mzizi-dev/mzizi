# The workspace root. `compiler/` predates this file and is a fully standalone
# crate in its own right (see compiler/Cargo.toml's own history) — this file
# adds `benchmarks/harness` alongside it without changing how `compiler` builds
# or how CI invokes it (every existing step runs with `working-directory:
# compiler` and, per Cargo's own rule, a command run from inside a workspace
# member defaults to that member unless `--workspace` is passed).
# `benchmarks/runner` (the `mzbench` binary) is the only member with dependencies; its
# Cargo.toml says why.
[workspace]
resolver = "2"
members = ["compiler", "benchmarks/harness", "benchmarks/runner"]
# The Dioxus arm's sandbox is its own workspace root (it declares an empty
# `[workspace]`), so CI's `--workspace` never builds Dioxus. Excluded here as well so a
# future glob in `members` cannot pull it in. See benchmarks/arms/dioxus/README.md.
exclude = ["benchmarks/arms/dioxus"]
