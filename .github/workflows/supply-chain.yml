name: Supply chain

# The dependency half of issue #62 (shift-left security). Two checks, each on a
# different question:
#
# - `cargo deny` asks whether what a fresh build fetches today is acceptable: no
#   RustSec advisory, an allowed license, crates.io as the only source (deny.toml).
#   Cargo.lock is gitignored, so it resolves the newest versions the manifests
#   allow. It runs on every push and pull request, and weekly, because an advisory
#   can be published against a crate this repo already depends on with no change
#   here at all.
# - `dependency review` asks what a pull request itself changes: it fails a PR that
#   adds a dependency with a known vulnerability. It uses GitHub's dependency graph,
#   so it runs on pull requests only.
#
# Neither needs a secret. Both reach outside crates.io: cargo-deny fetches its
# binary and the RustSec advisory database from GitHub, as the `secret scan` job
# already fetches gitleaks.

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging, "claude/**"]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      # The release binary, checked against the SHA-256 the release publishes, as the
      # `secret scan` job installs gitleaks: no `cargo install` compile on every run.
      - name: Install cargo-deny
        env:
          VERSION: "0.20.2"
        run: |
          set -euo pipefail
          base="https://github.com/EmbarkStudios/cargo-deny/releases/download/${VERSION}"
          file="cargo-deny-${VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -sSL --fail -o "/tmp/${file}" "${base}/${file}"
          curl -sSL --fail -o "/tmp/${file}.sha256" "${base}/${file}.sha256"
          echo "$(cat "/tmp/${file}.sha256")  /tmp/${file}" | sha256sum --check
          tar -xzf "/tmp/${file}" -C /tmp
          sudo install "/tmp/cargo-deny-${VERSION}-x86_64-unknown-linux-musl/cargo-deny" /usr/local/bin/
          cargo-deny --version

      - name: cargo deny check (workspace)
        run: cargo-deny --config deny.toml check

      # B1's Rust reference is its own workspace root, so the run above does not see
      # it. It pins the same axum and tokio as `mz build`'s generated package
      # (compiler/src/lower.rs, PINS), so this run also covers most of what the
      # `lowering` job builds.
      - name: cargo deny check (B1 reference, axum + tokio)
        run: >-
          cargo-deny
          --manifest-path benchmarks/tasks/b1-routing/reference-rust/Cargo.toml
          --config deny.toml
          check

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: low
          comment-summary-in-pr: never
