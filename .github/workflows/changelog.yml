# AGENTS.md, "Changelog": every pull request adds a CHANGELOG.md entry under
# `## [Unreleased]` (owner rule, 2026-10-07). This job fails one that does not touch
# CHANGELOG.md. The `no-changelog` label exempts one, as does a Dependabot version bump.
#
# Not a required check: it is deliberately left out of branch protection (owner rule of
# 2026-09-30). The check publishes as `changelog / entry required`, the job's own name.

on:
  pull_request:
    # Labels change the verdict, so a label added or removed re-runs the job.
    types: [opened, synchronize, reopened, labeled, unlabeled]
    # As ci.yml: stacked pull requests target the branch below them.
    branches: [main, staging, "claude/**"]

permissions:
  contents: read

concurrency:
  group: changelog-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  entry:
    name: changelog / entry required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base and head commits, and their merge base, must be present to diff.
          fetch-depth: 0

      - name: Check for a CHANGELOG.md entry
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          NO_CHANGELOG: ${{ contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: .github/scripts/changelog-entry.sh "$BASE_SHA" "$HEAD_SHA"
