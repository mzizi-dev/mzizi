name: CI

# Recreated here from the `mzizi-lang` job of mzizi-dev/agent-tools'
# .github/workflows/ci.yml (the repo MIGRATION.md still calls
# `nyuchi/mzizi-tools`; it has since been renamed). The `git subtree split`
# that produced this repo
# carried only what lived inside the old `mzizi-lang/` directory; CI lives at a
# repo root by necessity, so it did not travel. See MIGRATION.md §3.
#
# The only intended change is the path prefix: the crate that was
# `mzizi-lang/compiler` is now `compiler`, and the corpus it checks is now one
# level up from it rather than two.

on:
  push:
    branches: [main]
  pull_request:
    # Not just main. Stacked pull requests target the branch below them in the
    # stack, and a filter of [main] silently gives every layer but the bottom
    # one zero checks — a green PR with nothing run looks identical to a
    # passing one.
    branches: [main, "claude/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  compiler:
    name: compiler
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler

      - name: cargo fmt --check
        working-directory: compiler
        run: cargo fmt -- --check

      - name: cargo clippy -D warnings
        working-directory: compiler
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: compiler
        run: cargo test

      # The example and every primitive must stay parseable by the shipped binary, not just
      # by the test harness — the charter's rule is that unverified bytes are worthless.
      - name: mz check every corpus example
        working-directory: compiler
        run: |
          for f in ../examples/*.mz; do
            echo "checking $f"
            cargo run --quiet --bin mz -- check "$f"
          done

      - name: mz check every primitive
        working-directory: compiler
        run: |
          for f in ../primitives/*.mz; do
            echo "checking $f"
            cargo run --quiet --bin mz -- check "$f"
          done

      # `mz contract` is a second gate, not a duplicate of the first. `mz check` proves the
      # corpus compiles; this proves it does what it says it does. CHARTER.md §6 keeps those
      # two apart deliberately — "a syntax/compile error is not itself a defect for this
      # metric" — and so do these two steps, so a red run says which of the two broke.
      - name: mz contract the corpus example and every primitive
        working-directory: compiler
        run: |
          for f in ../examples/*.mz ../primitives/*.mz; do
            echo "evaluating $f"
            cargo run --quiet --bin mz -- contract "$f"
          done

  # The `compiler` job runs with `working-directory: compiler`, which by Cargo's own rule
  # tests only that member. The benchmark harness and runner are workspace members too, and
  # without this job their tests never ran in CI. The Dioxus sandbox is excluded from the
  # workspace (root Cargo.toml), so nothing here builds Dioxus.
  benchmarks:
    name: benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check (workspace)
        run: cargo fmt --all -- --check

      - name: cargo clippy -D warnings (workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test (harness, runner and probe)
        run: cargo test -p mzizi-benchmark-harness -p mzizi-benchmark-runner -p mzizi-benchmark-probe

  # RFC-0011 §8: the example service lowered to an axum package, its generated `oneshot`
  # tests run, and the server started and asked one question over a real socket. Rust
  # only: the package's dependencies come from crates.io like the runner's, and the
  # request is written with bash's /dev/tcp, so no other toolchain is needed.
  lowering:
    name: lowering
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            target/mz-build/registry
            target/mz-build/b1-routing-reference
            benchmarks/tasks/b1-routing/reference-rust

      - name: mz build the example service
        working-directory: compiler
        run: cargo run --quiet --bin mz -- build ../examples/registry.mz --out ../target/mz-build/registry

      - name: cargo test the lowered service (one oneshot test per example)
        run: cargo test --manifest-path target/mz-build/registry/Cargo.toml

      - name: serve it, and answer OPTIONS over a socket
        run: |
          set -euo pipefail
          cargo build --release --manifest-path target/mz-build/registry/Cargo.toml
          PORT=18080 target/mz-build/registry/target/release/mz-registry > serve.log 2>&1 &
          server=$!
          for _ in $(seq 1 50); do grep -q listening serve.log && break; sleep 0.2; done
          exec 3<>/dev/tcp/127.0.0.1/18080
          printf 'OPTIONS /v1/ui HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          tr -d '\r' <&3 | tee response.txt
          kill "$server"
          grep -q '^HTTP/1.1 204' response.txt
          grep -qi '^allow: GET, HEAD, OPTIONS$' response.txt

      # RFC-0009 §2.3: every probe must pass against both of a backend task's references,
      # one in Mzizi (lowered by `mz build`) and one in plain axum, before any run.
      - name: mzprobe verify B1 against both references
        run: cargo run --quiet -p mzizi-benchmark-probe -- verify benchmarks/tasks/b1-routing

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history, not the default single commit. This repo's history
          # was produced by `git subtree split` out of another repository, so
          # every one of its commits is arriving under CI for the first time —
          # a scan of the tip would say nothing about the fifteen commits
          # underneath it.
          fetch-depth: 0

      # The gitleaks/gitleaks-action wrapper requires a paid licence for org
      # repos. The binary is MIT-licensed, so it runs directly and stays free.
      - name: Install gitleaks
        env:
          VERSION: "8.21.2"
        run: |
          set -euo pipefail
          curl -sSL --fail -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      - run: gitleaks detect --source . --redact --no-banner --verbose
