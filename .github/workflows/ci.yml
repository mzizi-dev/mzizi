name: CI

# Recreated here from the `mzizi-lang` job of mzizi-dev/agent-tools'
# .github/workflows/ci.yml (the repo MIGRATION.md still calls
# `nyuchi/mzizi-tools`; it has since been renamed). The `git subtree split`
# that produced this repo
# carried only what lived inside the old `mzizi-lang/` directory; CI lives at a
# repo root by necessity, so it did not travel. See MIGRATION.md §3.
#
# The only intended change is the path prefix: the crate that was
# `mzizi-lang/compiler` is now `compiler`, and the repo's `.mz` files it checks are now
# one level up from it rather than two.

on:
  push:
    branches: [main, staging]
  pull_request:
    # Not just main. Stacked pull requests target the branch below them in the
    # stack, and a filter of [main] silently gives every layer but the bottom
    # one zero checks — a green PR with nothing run looks identical to a
    # passing one.
    branches: [main, staging, "claude/**"]
  # Required checks must also report on a merge queue's gh-readonly-queue/** ref, or a queued
  # PR waits until the queue times it out. Harmless where no queue is configured.
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  compiler:
    name: compiler
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: compiler

      - name: cargo fmt --check
        working-directory: compiler
        run: cargo fmt -- --check

      # The pre-commit hook's own tests, in a throwaway repository under $RUNNER_TEMP: git
      # and rustfmt, no network.
      - name: pre-commit hook tests
        env:
          TMPDIR: ${{ runner.temp }}
        run: bash scripts/test-pre-commit.sh

      - name: cargo clippy -D warnings
        working-directory: compiler
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: compiler
        run: cargo test

      # The example and every primitive must stay parseable by the shipped binary, not just
      # by the test harness — the charter's rule is that unverified bytes are worthless.
      - name: mz check every example
        working-directory: compiler
        run: |
          for f in ../examples/*.mz; do
            echo "checking $f"
            cargo run --quiet --bin mz -- check "$f"
          done

      - name: mz check every primitive
        working-directory: compiler
        run: |
          for f in ../primitives/*.mz; do
            echo "checking $f"
            cargo run --quiet --bin mz -- check "$f"
          done

      # `mz contract` is a second gate, not a duplicate of the first. `mz check` proves the
      # repo's `.mz` files compile; this proves it does what it says it does. CHARTER.md §6 keeps those
      # two apart deliberately — "a syntax/compile error is not itself a defect for this
      # metric" — and so do these two steps, so a red run says which of the two broke.
      - name: mz contract every example and every primitive
        working-directory: compiler
        run: |
          for f in ../examples/*.mz ../primitives/*.mz; do
            echo "evaluating $f"
            cargo run --quiet --bin mz -- contract "$f"
          done

  # The `compiler` job runs with `working-directory: compiler`, which by Cargo's own rule
  # tests only that member. The benchmark harness and runner are workspace members too, and
  # without this job their tests never ran in CI. The Dioxus sandbox is excluded from the
  # workspace (root Cargo.toml), so nothing here builds Dioxus.
  benchmarks:
    name: benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo fmt --check (workspace)
        run: cargo fmt --all -- --check

      - name: cargo clippy -D warnings (workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Its own workspace root, excluded from the repository's, so `--all` and `--workspace`
      # above miss it.
      - name: cargo fmt and clippy (benchmarks/perf/rust, the perf suite's Rust references)
        run: |
          cargo fmt --manifest-path benchmarks/perf/rust/Cargo.toml -- --check
          cargo clippy --offline --manifest-path benchmarks/perf/rust/Cargo.toml --all-targets -- -D warnings

      - name: cargo test (harness, runner and probe)
        run: cargo test -p mzizi-benchmark-harness -p mzizi-benchmark-runner -p mzizi-benchmark-probe

  # RFC-0011 §8: the example service lowered to an axum package, its generated `oneshot`
  # tests run, and the server started and asked one question over a real socket. Rust
  # only: the package's dependencies come from crates.io like the runner's, and the
  # request is written with bash's /dev/tcp, so no other toolchain is needed.
  lowering:
    name: lowering
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            target/mz-build/registry
            target/mz-build/b1-routing-reference
            benchmarks/tasks/b1-routing/reference-rust
            target/mz-build/b2-validation-reference
            benchmarks/tasks/b2-validation/reference-rust
            target/mz-build/b3-mirror-reference
            benchmarks/tasks/b3-mirror/reference-rust
            benchmarks/tasks/b4-state/reference-rust
            benchmarks/tasks/b5-errors/reference-rust

      - name: mz build the example service
        working-directory: compiler
        run: cargo run --quiet --bin mz -- build ../examples/registry.mz --out ../target/mz-build/registry

      - name: cargo test the lowered service (one oneshot test per example)
        run: cargo test --manifest-path target/mz-build/registry/Cargo.toml

      - name: serve it, and answer OPTIONS over a socket
        run: |
          set -euo pipefail
          cargo build --release --manifest-path target/mz-build/registry/Cargo.toml
          PORT=18080 target/mz-build/registry/target/release/mz-registry > serve.log 2>&1 &
          server=$!
          for _ in $(seq 1 50); do grep -q listening serve.log && break; sleep 0.2; done
          exec 3<>/dev/tcp/127.0.0.1/18080
          printf 'OPTIONS /v1/ui HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          tr -d '\r' <&3 | tee response.txt
          kill "$server"
          grep -q '^HTTP/1.1 204' response.txt
          grep -qi '^allow: GET, HEAD, OPTIONS$' response.txt

      # A container needs the service reachable off loopback (`HOST=0.0.0.0`), and a bad
      # `HOST` must stop it rather than bind somewhere unintended.
      - name: serve it on a non-loopback address, and refuse a bad HOST
        run: |
          set -euo pipefail
          bin=target/mz-build/registry/target/release/mz-registry
          if HOST=not-an-ip "$bin" > bad-host.log 2>&1; then echo "bad HOST was accepted"; exit 1; fi
          grep -q 'HOST must be an IP address' bad-host.log
          addr=$(hostname -I | tr ' ' '\n' | grep -v '^127\.' | head -n 1)
          test -n "$addr"
          HOST=0.0.0.0 PORT=18081 "$bin" > serve-host.log 2>&1 &
          server=$!
          for _ in $(seq 1 50); do grep -q listening serve-host.log && break; sleep 0.2; done
          exec 3<>/dev/tcp/"$addr"/18081
          printf 'OPTIONS /v1/ui HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          tr -d '\r' <&3 | tee response-host.txt
          kill "$server"
          grep -q '^HTTP/1.1 204' response-host.txt

      # RFC-0009 §2.3: every probe must pass against both of a backend task's references,
      # one in Mzizi (lowered by `mz build`) and one in plain axum, before any run.
      - name: mzprobe verify B1 against both references
        run: cargo run --quiet -p mzizi-benchmark-probe -- verify benchmarks/tasks/b1-routing

      # B2 and B3 have a Mzizi reference too. B4 and B5 have none: RFC-0011 §10 says their state
      # and request bodies are not built, so their two references are axum and Python's
      # standard library (python3 is on the runner).
      - name: mzprobe verify B2 against both references
        run: cargo run --quiet -p mzizi-benchmark-probe -- verify benchmarks/tasks/b2-validation

      - name: mzprobe verify B3 against both references
        run: cargo run --quiet -p mzizi-benchmark-probe -- verify benchmarks/tasks/b3-mirror

      - name: mzprobe verify B4 against its Rust and Python references
        run: cargo run --quiet -p mzizi-benchmark-probe -- verify benchmarks/tasks/b4-state

      - name: mzprobe verify B5 against its Rust and Python references
        run: cargo run --quiet -p mzizi-benchmark-probe -- verify benchmarks/tasks/b5-errors

      # RFC-0013 §15.3 and §18.4: every example program runs through `mz run` (lowered to
      # Rust, built with cargo, run), and its standard output must match the committed
      # `examples/<name>.expected`. A program's package has no dependencies, so this step
      # needs no network.
      - name: mz run every example program against its .expected output
        run: |
          set -euo pipefail
          cargo build --quiet -p mzizi-lang-compiler --bin mz
          for program in examples/*.mz; do
            grep -q '^program ' "$program" || continue
            expected="${program%.mz}.expected"
            test -f "$expected" || { echo "$program has no $expected"; exit 1; }
            echo "running $program"
            target/debug/mz run "$program" > actual.txt
            diff -u "$expected" actual.txt
          done

      # benchmarks/perf: each program built three ways (lowered by `mz build`, and two
      # hand-written Rust references, overflow unchecked and checked), and all three must
      # print the committed .expected. Correctness only: nothing is timed, because a shared
      # runner is too noisy to gate on. Every package is std only and built --offline, and
      # the debug `mz` from the step above is reused, since nothing here times it. Its 12
      # throwaway target directories go under RUNNER_TEMP, outside ./target, so the Rust
      # cache does not save them.
      - name: perf suite builds and agrees (benchmarks/perf, --check-only)
        run: MZ=target/debug/mz benchmarks/perf/run.sh --check-only --out "$RUNNER_TEMP/perf"

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, not the default single commit. This repo's history
          # was produced by `git subtree split` out of another repository, so
          # every one of its commits is arriving under CI for the first time —
          # a scan of the tip would say nothing about the fifteen commits
          # underneath it.
          fetch-depth: 0

      # The gitleaks/gitleaks-action wrapper requires a paid licence for org
      # repos. The binary is MIT-licensed, so it runs directly and stays free.
      - name: Install gitleaks
        env:
          VERSION: "8.21.2"
        run: |
          set -euo pipefail
          curl -sSL --fail -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      - run: gitleaks detect --source . --redact --no-banner --verbose
