[package]
name = "mzizi-lang-compiler"
version = "0.0.0"
edition = "2024"
# Restored here after being lost in transit: mzizi-dev/agent-tools#103 added this
# line while mzizi-dev/agent-tools#106 deleted the directory it lived in. Git
# merged both cleanly, so nothing failed and nothing warned — the line simply
# ceased to exist. The repo-level LICENSE has always been Apache-2.0; this makes
# the crate metadata say so too.
license = "Apache-2.0"
repository = "https://github.com/mzizi-dev/mzizi"
homepage = "https://mzizi.dev"
keywords = ["mzizi", "compiler", "language", "agent"]
categories = ["compilers", "development-tools"]
# The integration tests read the repo's examples and primitives from outside this directory, so
# they cannot run from the packaged tarball.
exclude = ["tests/**"]
description = "The Mzizi compiler, `mz` (Phase 0 prototype): lexer, recovering parser, name and type resolver, the agent NDJSON diagnostic protocol with exact fixes, contract evaluation, the content-addressed IR, lowering of a `service` to a local Rust + axum package, and `mz run`, which lowers a `program` in RFC-0013's foundation slice to a dependency-free Rust package and runs it. No component lowers yet (RFC-0001, RFC-0003, RFC-0006, RFC-0008, RFC-0011, RFC-0013)."

# No dependencies, deliberately. The house convention across the Rust crates is to
# hand-roll small, fully-specified things (JSON emission here) rather than take a
# dependency; and a compiler whose check loop must stay sub-second on a modest laptop
# should not start life with a dependency tree to build first.
[dependencies]

# The `mz` command moves to mzizi-dev/mzizi-cli, which depends on this crate as a library with
# default features off. The binary stays here, behind the on-by-default `cli` feature, until a
# released `mz` replaces it; this repo's CI and benchmarks keep running `cargo run --bin mz`.
[features]
default = ["cli"]
cli = []

[[bin]]
name = "mz"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "mzizi_lang_compiler"
path = "src/lib.rs"
