# cargo-deny policy (https://embarkstudios.github.io/cargo-deny/). CI's `supply chain`
# job runs `cargo deny check` against the workspace and against B1's Rust reference,
# which pulls the same `axum` and `tokio` that `mz build`'s generated package does.
# `Cargo.lock` is gitignored, so each run resolves the latest versions the manifests
# allow: this checks what a fresh build would fetch today, not a pinned set.

[graph]
all-features = true

[advisories]
# Every RustSec advisory fails the check: vulnerabilities, unmaintained and unsound
# crates alike. Add an `ignore` entry only with the advisory ID and a reason.
ignore = []

[licenses]
# Each license here is one at least one crate in the graph uses today. Widen the list
# in the pull request that adds a crate needing another.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSL-1.0",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
]
confidence-threshold = 0.93
# Two runs share this file, and each graph uses only part of the list.
unused-allowed-license = "allow"

[bans]
# Two majors of one crate (today `winnow` 0.7 and 1.0, both under `toml`) cost build
# time, not safety, so they warn rather than fail.
multiple-versions = "warn"
wildcards = "deny"

[sources]
# crates.io only: AGENTS.md says it is the one registry this repo's builds reach.
unknown-registry = "deny"
unknown-git = "deny"
