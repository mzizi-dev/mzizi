# The Go backend arm (RFC-0009 §1, §3). Format: ../../runner/README.md, "Arms: `arm.toml`".
# The pins and their provenance are in README.md in this directory.
id = "go"
family = "backend"
task_families = ["backend"]
language_name = "Go"
file_kind = "a single Go source file (.go), package main, using net/http"
extension = "go"
guide = "benchmarks/prompts/go-guide.md"
check = ["{repo}/benchmarks/arms/go/check.sh", "{file}"]
normaliser = "file-name"
# A backend episode is scored by the task's probes (benchmarks/probe), not by a source
# extractor. Until the runner calls the probe crate, clean episodes are clean but unscored.
extractor = "none"
pins = ["sandbox/Containerfile"]
