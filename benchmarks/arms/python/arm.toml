# The Python backend arm (RFC-0009 §1, §3). Format: ../../runner/README.md, "Arms:
# `arm.toml`". The pins and their provenance are in README.md in this directory.
id = "python"
family = "backend"
task_families = ["backend"]
language_name = "Python with FastAPI"
file_kind = "a single Python source file (.py) using FastAPI"
extension = "py"
guide = "benchmarks/prompts/python-guide.md"
check = ["{repo}/benchmarks/arms/python/check.sh", "{file}"]
normaliser = "file-name"
# A backend episode is scored by the task's probes (benchmarks/probe), not by a source
# extractor. Until the runner calls the probe crate, clean episodes are clean but unscored.
extractor = "none"
pins = [
  "sandbox/Containerfile",
  "sandbox/requirements.txt",
  "sandbox/package.json",
  "sandbox/package-lock.json",
]
