# The Rust backend arm (RFC-0009 §1, §3). Format: ../../runner/README.md, "Arms: `arm.toml`".
# The pins and their provenance are in README.md in this directory.
id = "rust"
family = "backend"
task_families = ["backend"]
language_name = "Rust with axum"
file_kind = "a single Rust source file (.rs), a binary crate using axum, tokio and serde"
extension = "rs"
guide = "benchmarks/prompts/rust-guide.md"
check = ["{repo}/benchmarks/arms/rust/check.sh", "{file}"]
normaliser = "file-name"
# A backend episode is scored by the task's probes (benchmarks/probe), not by a source
# extractor. Until the runner calls the probe crate, clean episodes are clean but unscored.
extractor = "none"
pins = ["sandbox/Containerfile", "sandbox/Cargo.toml", "sandbox/Cargo.lock"]
