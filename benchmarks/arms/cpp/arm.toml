# The C++ backend arm (RFC-0009 §1, §3). Format: ../../runner/README.md, "Arms: `arm.toml`".
# The pins and their provenance are in README.md in this directory.
id = "cpp"
family = "backend"
task_families = ["backend"]
language_name = "C++20"
file_kind = "a single C++20 source file (.cpp) using cpp-httplib and nlohmann/json"
extension = "cpp"
guide = "benchmarks/prompts/cpp-guide.md"
check = ["{repo}/benchmarks/arms/cpp/check.sh", "{file}"]
normaliser = "file-name"
# A backend episode is scored by the task's probes (benchmarks/probe), not by a source
# extractor. Until the runner calls the probe crate, clean episodes are clean but unscored.
extractor = "none"
pins = [
  "sandbox/Containerfile",
  "sandbox/NOTICE",
  "sandbox/include/httplib.h",
  "sandbox/include/nlohmann/json.hpp",
]
