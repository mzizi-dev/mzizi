# B2's probes (RFC-0009 §2.3). Each expected status, header, body and JSON value is one
# fact. `clause` is the spec rule the probe checks: B2.1 reading the query string, B2.2 which
# values are integers, B2.3 the ranges, B2.4 methods, B2.5 other paths. Every probe must
# pass against both references (`mzprobe verify benchmarks/tasks/b2-validation`).

[[probe]]
id = "none"
clause = "B2.1"
request = { method = "GET", path = "/v1/ui" }
expect = { status = 200, headers = { "content-type" = "application/json", "x-mzizi-source" = "registry" }, json_null = ["/node", "/limit", "/offset"] }

[[probe]]
id = "all-three"
clause = "B2.1"
request = { method = "GET", path = "/v1/ui?node=N2&limit=5&offset=10" }
expect = { status = 200, headers = { "content-type" = "application/json", "x-mzizi-source" = "registry" }, json = { "/node" = "N2", "/limit" = 5, "/offset" = 10 } }

[[probe]]
