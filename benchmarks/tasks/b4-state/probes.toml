# B4's probes (RFC-0009 §2.3). Each expected status, header, body and JSON value is one
# fact. The probes run in file order against one server that starts empty, and later probes
# depend on earlier ones: that is what the task tests. `clause` is the spec rule the probe
# checks: B4.1 listing, B4.2 recording, B4.3 the 409, B4.4 the 400, B4.5 separate histories,
# B4.6 the name check, B4.7 methods and other paths. Every probe must pass against every
# reference (`mzprobe verify benchmarks/tasks/b4-state`).

[[probe]]
id = "badge-empty"
clause = "B4.1"
request = { method = "GET", path = "/v1/ui/badge/versions" }
expect = { status = 200, headers = { "content-type" = "application/json", "x-mzizi-source" = "registry" }, json = { "/component" = "badge", "/count" = 0, "/versions" = [] } }

[[probe]]
id = "record-first"
clause = "B4.2"
request = { method = "POST", path = "/v1/ui/badge/versions", headers = { "content-type" = "application/json" }, body_file = "fixtures/v1.json" }
expect = { status = 201, headers = { "content-type" = "application/json", "x-mzizi-source" = "registry", location = "/v1/ui/badge/versions" }, json = { "/component" = "badge", "/version" = "1.0.0", "/count" = 1 } }

[[probe]]
id = "list-one"
clause = "B4.1"
request = { method = "GET", path = "/v1/ui/badge/versions" }
expect = { status = 200, headers = { "content-type" = "application/json", "x-mzizi-source" = "registry" }, json = { "/component" = "badge", "/count" = 1, "/versions" = ["1.0.0"] } }

[[probe]]
id = "record-second"
clause = "B4.2"
request = { method = "POST", path = "/v1/ui/badge/versions", headers = { "content-type" = "application/json" }, body_file = "fixtures/v2.json" }
