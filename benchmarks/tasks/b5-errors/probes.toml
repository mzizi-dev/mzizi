[[probe]]
id = "missing-text"
clause = "B5.4"
request = { method = "POST", path = "/v1/messages", headers = { "content-type" = "application/json" }, body_file = "fixtures/missing-text.json" }
expect = { status = 400, headers = { "content-type" = "application/json", "x-mzizi-source" = "registry" }, json = { "/error" = "Invalid message" } }

[[probe]]
id = "empty-text"
clause = "B5.4"
request = { method = "POST", path = "/v1/messages", headers = { "content-type" = "application/json" }, body_file = "fixtures/empty-text.json" }
expect = { status = 400, headers = { "content-type" = "application/json", "x-mzizi-source" = "registry" }, json = { "/error" = "Invalid message" } }

[[probe]]
id = "array"
clause = "B5.4"
request = { method = "POST", path = "/v1/messages", headers = { "content-type" = "application/json" }, body_file = "fixtures/array.json" }
expect = { status = 400, headers = { "content-type" = "application/json", "x-mzizi-source" = "registry" }, json = { "/error" = "Invalid message" } }

[[probe]]
id = "fail"
clause = "B5.6"
request = { method = "GET", path = "/v1/fail" }
expect = { status = 500, headers = { "content-type" = "application/json", "x-mzizi-source" = "registry" }, json = { "/error" = "Internal server error" } }

[[probe]]
id = "fail-head"
