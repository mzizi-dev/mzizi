request = { method = "HEAD", path = "/v1/fail" }
expect = { status = 500, headers = { "content-type" = "application/json", "x-mzizi-source" = "registry" }, body = "" }

[[probe]]
id = "health"
clause = "B5.7"
request = { method = "GET", path = "/v1/health" }
expect = { status = 200, headers = { "content-type" = "application/json", "x-mzizi-source" = "registry" }, json = { "/status" = "ok" } }

[[probe]]
