clause = "B5.7"
request = { method = "OPTIONS", path = "/v1/health" }
expect = { status = 204, headers = { allow = "GET, HEAD, OPTIONS", "x-mzizi-source" = "registry" }, body = "" }

[[probe]]
id = "health-post"
clause = "B5.7"
request = { method = "POST", path = "/v1/health", headers = { "content-type" = "application/json" }, body_file = "fixtures/ok.json" }
