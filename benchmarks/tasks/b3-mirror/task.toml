# B3 (RFC-0009 §2.4): a Worker endpoint's real routes, mirrored. A development task: it is
# derived from a public repository, so it is contaminated by construction and never gating.
name = "b3-mirror"
spec_md = "spec.md"
# The runner requires one reference file to exist; a backend task is scored by its probes
# (probes.toml), never against this file.
reference = "reference-rust/src/main.rs"

[backend]
# Every probe must pass against both before any run (RFC-0009 §2.3; `mzprobe verify`).
references = ["reference-mzizi", "reference-rust"]

[source]
repo = "mzizi-dev/mzizi-api-gateway"
commit = "2468b2a"
# Scope: RFC-0009 §2.4 lists a filtered `/v1/ui` listing with `meta` and the `nyuchi-*` ->
# `mzizi-*` `308` that keeps sub-path and query. RFC-0011 §10 says a Mzizi handler cannot yet
# express either (list data in handlers, text operations), so this task leaves them out, and
# the task is narrower than the RFC's row. The listing is a fixed fixture, and the retired
# paths here are this task's own choice. Nothing was fetched from the gateway.
facts = [
  "/v1/health, /v1/ui and /v1/ui/{name} (RFC-0009 §2.4)",
  "410 for retired routes (RFC-0009 §2.4)",
  "503 {\"error\":\"Database not configured\"} (RFC-0009 §2.4)",
  "CORS and X-Mzizi-Source headers on every response (RFC-0009 §2.4)",
  "the cache-control values are this task's own, except the 404's (RFC-0010 §3.2)",
]
